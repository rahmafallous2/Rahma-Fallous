<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rahma Fallous — Software Engineer</title>
<meta name="description" content="Portfolio of Rahma Fallous, Computer Science graduate and backend-focused software engineer: Java Spring Boot, React, REST APIs, applied AI and data.">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600&family=Allura&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0c;--p1:#141415;--p2:#1b1b1d;--red:#d4141c;--red2:#7a0b10;--tx:#f2f2f2;--mu:#9a9a9f;--ln:#2a2a2d;
--hd:Anton,Impact,'Arial Narrow',sans-serif;--sn:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;--sc:Allura,'Brush Script MT',cursive;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 var(--sn)}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--red);outline-offset:3px}
.w{max-width:1180px;margin:0 auto;padding:0 24px}
h1,h2,h3{font-family:var(--hd);font-weight:400;text-transform:uppercase;margin:0;line-height:1.02;letter-spacing:.01em}
p{margin:0 0 1em;color:#cfcfd2;max-width:60ch}
.red{color:var(--red)}.mu{color:var(--mu)}
.lbl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--red);font-weight:600}
header{position:sticky;top:0;z-index:10;background:rgba(11,11,12,.95);border-bottom:1px solid var(--ln)}
nav{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.logo{font-family:var(--hd);font-size:28px;display:flex;align-items:center;height:40px}
.logo img{max-height:40px;max-width:120px;object-fit:contain}
nav ul{display:flex;gap:26px;list-style:none;margin:0;padding:0}
nav ul a{font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:500;padding:10px 0;border-bottom:2px solid transparent;transition:border-color .25s,color .25s}
nav ul a:hover{color:var(--red)}nav ul a.on{border-color:var(--red)}
@media(max-width:620px){nav{height:auto;flex-wrap:wrap;padding:10px 0}nav ul{width:100%;justify-content:space-between;gap:6px}nav ul a{font-size:11px}}
.bar{background:var(--red2);font-size:13px;padding:8px 0;text-align:center}
.btn{display:inline-flex;align-items:center;gap:10px;min-height:46px;padding:0 22px;border:1px solid var(--red);font-weight:600;font-size:13px;letter-spacing:.08em;text-transform:uppercase;background:none;color:var(--tx);cursor:pointer;font-family:var(--sn);transition:background .25s}
.btn.f{background:var(--red)}.btn:hover{background:var(--red2)}
.btn.sm{min-height:34px;padding:0 12px;font-size:11px}
/* hero */
.hero{position:relative;overflow:hidden;background:linear-gradient(180deg,#3a0709 0,var(--bg) 100%);border-bottom:1px solid var(--ln)}
.big{position:absolute;top:-.12em;left:0;right:0;text-align:center;font:clamp(110px,24vw,330px)/1 var(--hd);color:var(--red);opacity:.9;pointer-events:none;user-select:none}
.hg{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:clamp(120px,22vw,300px) 0 48px;align-items:end}
.hi{font-family:var(--sc);font-size:40px;color:#ddd;margin-bottom:-6px}
.hg h1{font-size:clamp(52px,8vw,100px)}
.role{color:var(--red);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin:14px 0}
.stats{display:flex;flex-direction:column;gap:14px;margin-top:20px}
.stat{display:flex;gap:16px;align-items:baseline;border-bottom:1px solid var(--ln);padding-bottom:12px}
.stat b{font:36px/1 var(--hd);color:var(--red);min-width:90px}
.stat span{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mu)}
.ph{position:relative;aspect-ratio:3/4;background:var(--p2);display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid var(--ln)}
.ph img,.ph video{width:100%;height:100%;object-fit:cover;display:block}
.ph .em{color:var(--mu);font-size:13px;text-align:center;padding:12px}
.up{position:absolute;right:8px;bottom:8px;z-index:3}
@media(max-width:820px){.hg{grid-template-columns:1fr}.ph.me{max-width:340px;margin:0 auto;order:-1}}
/* sections */
.sec{padding:64px 0;border-bottom:1px solid var(--ln)}
.sh{display:flex;align-items:center;gap:20px;margin-bottom:32px}
.sh h2{font-size:clamp(28px,4vw,40px);white-space:nowrap}.sh i{flex:1;height:1px;background:var(--ln)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:24px}
@media(max-width:820px){.grid3{grid-template-columns:1fr}}
.card .ph{aspect-ratio:16/10}.card .ph img,.card .ph video{transition:transform .5s}.card:hover .ph img,.card:hover .ph video{transform:scale(1.04)}
.card{display:block}
.cr{display:flex;gap:14px;align-items:center;margin-top:12px}
.cr .n{font:34px/1 var(--hd);color:var(--red)}.cr b{display:block;font-size:14px;text-transform:uppercase}.cr small{color:var(--mu);font-size:12px}
.cr .ar{margin-left:auto;transition:transform .25s}.card:hover .ar{transform:translateX(5px)}
.panel{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:0;background:var(--p1);border:1px solid var(--ln)}
.panel>div{padding:28px;border-right:1px solid var(--ln)}.panel>div:last-child{border:0;background:linear-gradient(160deg,var(--red2),var(--red))}
@media(max-width:900px){.panel{grid-template-columns:1fr}.panel>div{border:0;border-bottom:1px solid var(--ln)}}
.panel h3{font-size:22px;margin-bottom:18px}
.chips{display:flex;flex-wrap:wrap;gap:8px}.chips span{border:1px solid var(--ln);padding:4px 10px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#ddd}
.step{display:grid;grid-template-columns:28px 1fr;gap:12px;margin-bottom:14px;font-size:14px}.step b{color:var(--red);font-family:var(--hd)}
.step strong{color:var(--red);font-size:12px;letter-spacing:.08em;text-transform:uppercase;display:block}
.quote{font-size:20px;line-height:1.3;color:#fff}.quote em{font-family:var(--sc);font-size:34px;display:block;margin-top:12px;font-style:normal}
.row{display:grid;grid-template-columns:220px 1fr;gap:24px;padding:20px 0;border-top:1px solid var(--ln)}
.row h3{font-size:20px;font-family:var(--sn);text-transform:none;font-weight:600}.row p{margin:0}
@media(max-width:620px){.row{grid-template-columns:1fr;gap:4px}}
.pg{padding:56px 0 24px}.pg h1{font-size:clamp(46px,8vw,96px)}
.item{display:grid;grid-template-columns:1.2fr 1fr;gap:36px;padding:40px 0;border-top:1px solid var(--ln);align-items:center}
.item:nth-child(even){grid-template-columns:1fr 1.2fr}.item:nth-child(even) .ph{order:2}
.item .ph{aspect-ratio:16/10}.item h2{font-size:clamp(30px,4vw,48px);margin:8px 0 14px}
.stk{font-size:13px;color:var(--mu);border-top:1px solid var(--ln);padding-top:10px;margin:14px 0}
@media(max-width:820px){.item,.item:nth-child(even){grid-template-columns:1fr}.item:nth-child(even) .ph{order:0}}
.cs{display:grid;grid-template-columns:200px 1fr;gap:28px;padding:28px 0;border-top:1px solid var(--ln)}.cs ul{margin:0;padding-left:1.1em}
.todo{border:1px dashed var(--mu);padding:12px 16px;color:var(--mu);font-size:14px;max-width:60ch}
@media(max-width:700px){.cs{grid-template-columns:1fr;gap:6px}}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}.gal .ph{aspect-ratio:16/10}
.ct{border-top:1px solid var(--red);margin-top:32px}
.ct div{display:grid;grid-template-columns:140px 1fr;gap:12px;padding:18px 0;border-bottom:1px solid var(--ln);align-items:center}
.ct input{background:var(--p1);border:1px solid var(--ln);color:var(--tx);padding:10px;font:inherit;width:100%;max-width:420px}
@media(max-width:600px){.ct div{grid-template-columns:1fr}}
footer{padding:28px 0;color:var(--mu);font-size:13px}footer .w{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.hero{position:relative;overflow:hidden;background:#000;min-height:clamp(640px,62vw,880px);border-bottom:1px solid var(--ln)}
.bigname{position:absolute;top:clamp(20px,5vw,70px);left:0;right:0;text-align:center;font:clamp(130px,31vw,440px)/.92 var(--hd);background:linear-gradient(180deg,#c9171e 0,#8a0c12 50%,#000 100%);-webkit-background-clip:text;background-clip:text;color:transparent;pointer-events:none;user-select:none;letter-spacing:-.01em}
.cut{position:absolute;z-index:2;bottom:0;left:50%;height:92%;width:auto;max-width:none;transform:translateX(-42%)}
.hmain{position:absolute;inset:0;left:50%;transform:translateX(-50%);z-index:3;display:grid;grid-template-columns:minmax(0,4fr) minmax(0,3.6fr) minmax(0,3fr);align-items:center;padding-top:40px;width:100%}
.hcopy .hi{font-family:var(--sc);font-size:clamp(32px,3.4vw,46px);color:var(--red);margin:0 0 -4px}
.hcopy h1{font-size:clamp(54px,7.2vw,104px);color:#f1f1f1;line-height:.95}
.hcopy .role{font-size:clamp(18px,1.8vw,24px);line-height:1.25;margin:18px 0 14px;font-weight:500}
.hcopy p{font-size:15px;max-width:34ch}.hb{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.hside{align-self:center;padding-top:60px}
.tur{display:flex;gap:16px;align-items:center;margin-bottom:28px}.tur p{margin:0;font-size:15px;max-width:20ch}
.plus{display:inline-flex;width:54px;height:54px;border:1px solid var(--red);border-radius:50%;align-items:center;justify-content:center;color:var(--tx);font-size:24px;flex:none}
.hside .stats{margin:0}.hside .stat b{font-size:clamp(34px,3.6vw,50px);color:var(--red);min-width:0;margin-right:6px}
.stat{border-bottom:1px solid #3a3a3d;align-items:center}.stat span{line-height:1.3}
.scr{position:absolute;z-index:4;left:max(24px,calc(50% - 580px));bottom:32px;display:flex;align-items:center;gap:18px;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#ccc}
.scr .plus{width:50px;height:50px;font-size:20px;color:var(--red)}
@media(max-width:900px){.hero{min-height:880px}.bigname{font-size:36vw}.cut{height:60%;transform:translateX(-45%);left:50%}
.hmain{grid-template-columns:1fr;align-content:end;align-items:end;padding:0 24px 96px;gap:18px}.hmain>div:nth-child(2){display:none}.hside{padding:0}.hside .tur{display:none}.hside .stats{flex-direction:row;gap:16px}.hside .stat{flex-direction:column;align-items:flex-start;gap:2px;flex:1}.scr{display:none}}
.pg{position:relative;padding-top:clamp(90px,14vw,170px)}
.pg::before{content:attr(data-w);position:absolute;top:0;left:24px;font:clamp(110px,22vw,300px)/.9 var(--hd);background:linear-gradient(180deg,#b3141b,transparent 88%);-webkit-background-clip:text;background-clip:text;color:transparent;pointer-events:none;white-space:nowrap}
.pg>*{position:relative}.pg h1{text-shadow:0 2px 20px #000}

html{scroll-behavior:smooth;scroll-padding-top:72px}
#prog{position:fixed;left:0;right:0;top:0;height:2px;background:var(--red);transform-origin:0 50%;transform:scaleX(0);z-index:40;will-change:transform}
#app{transition:opacity .26s ease}#app.out{opacity:0}
@keyframes up{from{opacity:0;translate:0 44px}to{opacity:1;translate:0 0}}
@keyframes drop{from{opacity:0;translate:0 -50px;scale:1.07}to{opacity:1;translate:0 0;scale:1}}
@keyframes rise{from{opacity:0;translate:0 90px}to{opacity:1;translate:0 0}}
@keyframes wipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
.bigname{translate:0 calc(var(--sy,0)*.22px);animation:drop 1.6s cubic-bezier(.16,1,.3,1) backwards;will-change:translate}
.cut{translate:0 calc(var(--sy,0)*.07px);animation:rise 1.5s cubic-bezier(.16,1,.3,1) .25s backwards;will-change:translate}
.hcopy>*{animation:up 1.1s cubic-bezier(.16,1,.3,1) backwards}
.hcopy>:nth-child(1){animation-delay:.55s}.hcopy>:nth-child(2){animation-delay:.68s}.hcopy>:nth-child(3){animation-delay:.81s}.hcopy>:nth-child(4){animation-delay:.94s}.hcopy>:nth-child(5){animation-delay:1.07s}
.hside .tur{animation:up 1.1s cubic-bezier(.16,1,.3,1) .9s backwards}
.hside .stat{animation:up 1s cubic-bezier(.16,1,.3,1) backwards;position:relative}
.hside .stat:nth-child(1){animation-delay:1.05s}.hside .stat:nth-child(2){animation-delay:1.2s}.hside .stat:nth-child(3){animation-delay:1.35s}
.scr{animation:up 1s cubic-bezier(.16,1,.3,1) 1.5s backwards}
.scr .plus{animation:bob 2.4s ease-in-out 2.5s infinite}
@keyframes bob{50%{translate:0 5px}}
.plus{transition:background .3s,transform .5s cubic-bezier(.16,1,.3,1)}.tur:hover .plus{transform:rotate(90deg);background:var(--red2)}
.sh i{transform-origin:0 50%}.rv.in i{animation:wipe 1.2s cubic-bezier(.16,1,.3,1) .2s backwards}
.rv{opacity:0;translate:0 34px;transition:opacity 1s cubic-bezier(.16,1,.3,1),translate 1s cubic-bezier(.16,1,.3,1)}
.rv.in{opacity:1;translate:0 0}
.btn{transition:background .35s,transform .35s cubic-bezier(.16,1,.3,1),border-color .35s}.btn:hover{transform:translateY(-2px)}
.card .ph{transition:border-color .4s}.card:hover .ph{border-color:var(--red)}
.card .ph img,.card .ph video,.item .ph img,.item .ph video{transition:transform 1.2s cubic-bezier(.16,1,.3,1)}.item:hover .ph img{transform:scale(1.04)}
.pg::before{animation:drop 1.4s cubic-bezier(.16,1,.3,1) backwards}
.quiet *,.quiet *::before{animation:none!important}.quiet .rv{opacity:1;translate:0 0;transition:none}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*,*::before{animation:none!important}.rv{opacity:1!important;translate:none!important}}

.ph.wide{aspect-ratio:16/9}.ph.wide video{object-fit:contain;background:#000}
.ph .em{background:linear-gradient(135deg,#2a0507,#141415);width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px}
.ph .em b{font:clamp(26px,3vw,40px)/1 var(--hd);color:var(--red);text-transform:uppercase}.ph .em span{font-size:12px;letter-spacing:.12em;text-transform:uppercase}
.gal .ph img{object-position:top;cursor:zoom-in}
.feat{margin:0 0 1em;padding-left:1.1em;color:#cfcfd2;max-width:70ch}.feat li{margin-bottom:6px}
.ct a{color:var(--tx);border-bottom:1px solid var(--red)}.ct a:hover{color:var(--red)}
#lb{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;padding:24px;cursor:zoom-out}
#lb.on{display:flex}#lb img{max-width:100%;max-height:100%;object-fit:contain}
</style></head>

{t:"NeuroSpark",c:"Education Technology",s:"Team project",y:"May 2026",d:"An AI-based learning platform for children with ADHD, built as a final-year team project. It delivers personalized content through adaptive backend logic and connects children, parents and therapists.",k:"React · Laravel · MySQL",
 r:"Final-year team project. I collaborated with my team to design features end to end, from data handling to the user-facing interaction.",
 ex:"<ul class='feat'><li><b>Child experience:</b> attention and memory games, a read-along story corner with word highlighting and voice practice, a breathing exercise, and a 3D LEGO-style builder for creative play.</li><li><b>Parent view:</b> link children, follow their progress, find a therapist and send feedback.</li><li><b>Therapist view:</b> patient list, session insights, anomaly alerts, pending invites, and clinical PDF and CSV export.</li><li><b>Admin view:</b> user management, games and learning content, voice instructions, feedback and sentiment analysis, and reports.</li></ul>",
 ap:"<p>React frontend, Laravel backend and a MySQL database. Adaptive backend logic personalizes the content each child receives, and the platform serves four role-based experiences: child, parent, therapist and administrator.</p>",
 thumb:"assets/neurospark/cover.webp",g:["assets/neurospark/ns-197.webp", "assets/neurospark/ns-198.webp", "assets/neurospark/ns-203.webp", "assets/neurospark/ns-206.webp", "assets/neurospark/ns-210.webp", "assets/neurospark/ns-213.webp", "assets/neurospark/ns-215.webp", "assets/neurospark/ns-223.webp", "assets/neurospark/ns-225.webp", "assets/neurospark/ns-227.webp", "assets/neurospark/ns-230.webp", "assets/neurospark/ns-235.webp", "assets/neurospark/ns-239.webp", "assets/neurospark/ns-252.webp", "assets/neurospark/ns-257.webp"]},
{t:"User Management System",c:"Backend / Full-Stack",s:"Ogero internship",y:"June–July 2026",d:"Built during my Ogero internship: a role-based admin console for managing users, roles and permissions, backed by REST APIs. Source code and company data are confidential.",k:"Java Spring Boot · React · REST APIs",
 r:"Developed and maintained the Spring Boot backend and React frontend, built and consumed the APIs that connect them to the database, and tested and debugged features with the team under deadline pressure, following code review practices.",
 ex:"<ul class='feat'><li>Secure sign-in and an operational dashboard with user, role and permission counts.</li><li>Create, read, update and delete users, with role assignment and active status.</li><li>Roles with levels and permission sets, plus a role hierarchy where child roles inherit permissions from a parent role.</li><li>A permissions catalog grouped by area, such as user management and role management.</li></ul>",
 ap:"<p>Java Spring Boot REST APIs on the backend and a React single-page admin interface on the frontend, connected to a database. The recording shows the interface only.</p>",
 thumb:"assets/user-management/poster.webp",video:"assets/user-management/demo.mp4",g:["assets/user-management/um-1.webp", "assets/user-management/um-2.webp", "assets/user-management/um-3.webp", "assets/user-management/um-4.webp", "assets/user-management/um-5.webp", "assets/user-management/um-6.webp"]},
{t:"Clothify",c:"E-commerce / Web Engineering",s:"",y:"April 2025",d:"A full-stack e-commerce platform with product management, a shopping cart and an administrative dashboard.",k:"Laravel · Full-stack web application",
 r:"I developed both the backend and the frontend, and designed the data handling and API structure behind the storefront.",
 ex:"<ul class='feat'><li><b>Storefront:</b> home page, product browsing with category and brand filters, registration and login, cart, a three-step shipping and checkout flow, and order confirmation.</li><li><b>Admin dashboard:</b> sales overview, recent orders, and management of products, brands and categories, including image upload.</li></ul>",
 ap:"<p>A Laravel application with a customer storefront and a separate admin area. Data handling and the API structure were designed to support a responsive storefront.</p>",

{t:"Care4All — Hospital Management System",c:"Desktop Application / Databases",s:"University project",y:"April 2024",d:"A desktop application for hospitals that manages patient records, appointment scheduling and administrative workflows on a relational database. Built for the Database Management Systems course (COSC231) at Rafik Hariri University.",k:"Visual Studio · Desktop GUI · Relational database (SQL)",
 r:"Individual project: I did the requirements analysis, the ER and physical database design, and the desktop application itself, and wrote the project report.",
